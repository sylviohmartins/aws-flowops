name: Quality
run-name: Quality · ${{ github.event_name }} · ${{ github.ref_name }}
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops
          POSTGRES_DB: flowops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowops -d flowops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLOWOPS_TEST_POSTGRES_DSN: postgresql://flowops:flowops@localhost:5432/flowops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Agent engineering policy
        run: python scripts/agents/validate.py
      - name: Install
        run: python -m pip install -e '.[dev,postgres]'
      - name: Format diagnostics
        run: ruff format --diff .
      - name: Lint
        if: always()
        run: ruff check .
      - name: Types
        if: always()
        run: mypy flowops
      - name: Tests and coverage
        if: always()
        run: pytest --cov=flowops --cov-report=term-missing --cov-report=xml --cov-fail-under=96
      - name: Security
        if: always()
        run: bandit -r flowops -ll
      - name: Dependency audit
        if: always()
        run: pip-audit
      - name: Build
        if: always()
        run: python -m build

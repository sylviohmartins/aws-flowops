name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Format diagnostics
        run: ruff format --diff .
      - name: Lint
        if: always()
        run: ruff check .
      - name: Types
        if: always()
        run: mypy flowops
      - name: Tests and coverage
        if: always()
        run: pytest --cov=flowops --cov-report=term-missing --cov-report=xml
      - name: Security
        if: always()
        run: bandit -r flowops -ll
      - name: Dependency audit
        if: always()
        run: pip-audit
      - name: Build
        if: always()
        run: python -m build

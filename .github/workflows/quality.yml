name: Quality
run-name: Quality · ${{ github.event_name }} · ${{ github.ref_name }}
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    name: Setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      FLOWOPS_TEST_SETUP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: project with spaces
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and launch through setup
        working-directory: project with spaces
        run: python -m unittest tests.test_setup -v
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops
          POSTGRES_DB: flowops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowops -d flowops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLOWOPS_TEST_POSTGRES_DSN: postgresql://flowops:flowops@localhost:5432/flowops
      FLOWOPS_TEST_LOCAL_AWS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Agent engineering policy
        run: python scripts/agents/validate.py
      - name: Install
        run: |
          python -m pip install 'pip>=26.2.1'
          python -m pip install -e '.[dev,postgres]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/flow-editor/package-lock.json
      - name: Install editor dependencies
        working-directory: frontend/flow-editor
        run: npm ci --ignore-scripts
      - name: Editor tests
        working-directory: frontend/flow-editor
        run: npm test
      - name: Editor build and reproducibility
        working-directory: frontend/flow-editor
        run: |
          npm run build
          git diff --exit-code -- ../../flowops/streamlit/flow_editor_assets
      - name: Editor dependency audit
        working-directory: frontend/flow-editor
        run: npm audit
      - name: Local AWS lab (real Docker Lambda)
        run: python scripts/setup.py --local --dev --install-only
      - name: Format diagnostics
        if: always()
        run: ruff format --diff .
      - name: Lint
        if: always()
        run: ruff check .
      - name: Types
        if: always()
        run: mypy flowops
      - name: Tests and coverage
        if: always()
        run: pytest --cov=flowops --cov-report=term-missing --cov-report=xml --cov-fail-under=96
      - name: Security
        if: always()
        run: bandit -r flowops -ll
      - name: Dependency audit
        if: always()
        run: pip-audit
      - name: Build
        if: always()
        run: python -m build
      - name: Install Chromium
        if: always()
        run: python -m playwright install --with-deps chromium
      - name: Browser acceptance
        if: always()
        run: python scripts/browser_acceptance.py
      - name: Local lab browser acceptance
        if: always()
        run: python -m scripts.browser_local_lab
      - name: Workspace usability browser acceptance
        if: always()
        run: python -m scripts.browser_workspace
      - name: Visual authoring keyboard and React acceptance
        if: always()
        run: python -m scripts.browser_workspace --authoring-completion
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 14
